# Images Docker de la démo : construites ici, publiées sur GHCR, téléchargées par la sandbox.
#
# Quand : après une CI réussie sur main (le code publié a passé les vérifications et les tests de
# bout en bout), ou à la main (workflow_dispatch).
#
# Quoi : les deux images qui sortent du Dockerfile, `runner` (le site) et `migrator` (migrations
# et seed), chacune pour deux architectures :
#   - amd64 : Killercoda, les PC, les Mac Intel ;
#   - arm64 : les Mac Apple Silicon, un VM ARM (Oracle).
# Chaque architecture se construit sur une machine de GitHub de la même architecture : pas
# d'émulation, plusieurs fois plus lente. Puis un dernier job réunit les deux sous un même nom
# (`:main`, et `:<commit>` pour revenir à une version précise) : Docker télécharge
# automatiquement celle de la machine.
#
# Aucun secret dans les images (partie « Docker », chapitre 3) : elles sont publiques, comme le
# code. Le seul jeton est GITHUB_TOKEN, limité à ce dépôt, le temps du workflow, pour écrire sur
# GHCR. Les actions externes sont figées à un commit précis, comme dans ci.yml.

name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Deux publications rapprochées : seule la dernière va au bout.
concurrency:
  group: images
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.arch }})
    # Après la CI : seulement si elle a réussi.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: true
      matrix:
        target: [runner, migrator]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le commit que la CI a testé, pas le dernier de main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Nom des images (GHCR veut des minuscules)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/akfc" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.PREFIX }}-${{ matrix.target }}:main-${{ matrix.arch }}
          # Le cache des couches reste chez GitHub : un push qui ne touche pas aux dépendances
          # ne réinstalle rien.
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

  manifest:
    name: ${{ matrix.target }} (amd64 + arm64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        target: [runner, migrator]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Un nom, deux architectures
        env:
          TARGET: ${{ matrix.target }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/akfc-${TARGET}"
          docker buildx imagetools create \
            -t "${image}:main" -t "${image}:${SHA::12}" \
            "${image}:main-amd64" "${image}:main-arm64"
