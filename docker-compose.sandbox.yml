# ══════════════════════════════════════════════════════════════════════════
#  AKFC — Sandbox recruteurs (stack complète)
#
#  git clone … && docker compose -f docker-compose.sandbox.yml up -d --build
#    → app sur http://localhost:3010
#    → fichiers stockés http://localhost:9001  (SeaweedFS)
#    → Mailpit (mails) http://localhost:8025
#
#  Reset total : docker compose -f docker-compose.sandbox.yml down -v
#
#  ⚠ Valeurs de démo (secrets bidon) : ne JAMAIS réutiliser en prod.
# ══════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: akfc
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: akfc_db
    volumes:
      - sandbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akfc -d akfc_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stockage compatible S3 (SeaweedFS, version figée) : crée le bucket « documents » au démarrage.
  storage:
    image: ghcr.io/chrislusf/seaweedfs:4.52
    command: mini -bucket=documents -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: sandbox
      AWS_SECRET_ACCESS_KEY: sandbox-secret
    ports:
      - "9000:8333"      # API S3 (URL signées vues par le navigateur)
      - "9001:8888"      # fichiers stockés
    volumes:
      - sandbox_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"      # UI web des mails
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Applique les migrations sur la base sandbox, puis s'arrête.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://akfc:sandbox@postgres:5432/akfc_db?schema=public"
      DIRECT_DATABASE_URL: "postgresql://akfc:sandbox@postgres:5432/akfc_db?schema=public"
      PRISMA_CLIENT_ENGINE_TYPE: "library"

  # Peuple la base de comptes de démo + contenu, puis s'arrête. Idempotent.
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://akfc:sandbox@postgres:5432/akfc_db?schema=public"
      DIRECT_DATABASE_URL: "postgresql://akfc:sandbox@postgres:5432/akfc_db?schema=public"
      PRISMA_CLIENT_ENGINE_TYPE: "library"
      APP_SHORT_NAME: "AKFC"
    command: ["sh", "-c", "pnpm prisma generate && node prisma/seed.sandbox.mjs"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_SHORT_NAME: "AKFC"
    depends_on:
      migrator:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: "production"

      # ── Base ──
      DATABASE_URL: "postgresql://akfc:sandbox@postgres:5432/akfc_db?schema=public"
      DIRECT_DATABASE_URL: "postgresql://akfc:sandbox@postgres:5432/akfc_db?schema=public"
      PRISMA_CLIENT_ENGINE_TYPE: "library"

      # ── Auth / identité ──
      JWT_SECRET: "sandbox-demo-jwt-secret-change-me-please-0123456789"
      NEXTAUTH_URL: "http://localhost:3010"
      # Lue au démarrage (le build ne la reçoit pas) : métadonnées, plan du site et robots.txt
      # désignent la sandbox, pas le site du club.
      NEXT_PUBLIC_SITE_URL: "http://localhost:3010"
      APP_SHORT_NAME: "AKFC"
      APP_FULL_NAME: "AKFC — Sandbox de démonstration"
      APP_SUPPORT_EMAIL: "contact@sandbox.local"

      # ── Stockage (R2) → SeaweedFS : tous les fichiers, bucket « documents ». Path-style. ──
      R2_ENDPOINT: "http://storage:8333"
      R2_ACCESS_KEY_ID: "sandbox"
      R2_SECRET_ACCESS_KEY: "sandbox-secret"
      R2_BUCKET: "documents"
      R2_FORCE_PATH_STYLE: "true"
      R2_PUBLIC_ENDPOINT: "http://localhost:9000"

      # ── SMTP → Mailpit (mails capturés, visibles sur :8025) ──
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_USER: "sandbox"
      SMTP_PASSWORD: "sandbox"
      SMTP_FROM_NOREPLY: "noreply@sandbox.local"

volumes:
  sandbox_pgdata:
  sandbox_storage:
