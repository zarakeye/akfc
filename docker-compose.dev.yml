# ══════════════════════════════════════════════════════════════════════════
#  AKFC — infrastructure de DÉVELOPPEMENT
#
#  Seuls les SERVICES tournent ici ; l'application, elle, tourne sur la machine
#  (`pnpm dev`) pour profiter du rechargement à chaud.
#
#    pnpm dev:infra        démarre base, stockage et boîte mail de test
#    pnpm dev:infra:stop   les arrête (les données restent)
#    docker compose -f docker-compose.dev.yml down -v   remise à zéro TOTALE
#
#  Ports choisis pour ne heurter ni la sandbox recruteurs (9000/9001/8025),
#  ni un Postgres déjà installé (5432). Tout écoute sur 127.0.0.1 seulement.
#    Postgres  127.0.0.1:5435
#    SeaweedFS 127.0.0.1:9200 (API S3)  ·  http://localhost:9201 (fichiers stockés)
#    Mailpit   127.0.0.1:1026 (SMTP)    ·  http://localhost:8026 (boîte web)
#
#  ⚠ Identifiants de développement, publics par nature : jamais en production.
# ══════════════════════════════════════════════════════════════════════════

name: akfc-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: akfc
      POSTGRES_PASSWORD: akfc-dev
      POSTGRES_DB: akfc_db
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - akfc-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akfc -d akfc_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stockage compatible S3 : joue le rôle de Cloudflare R2 en local.
  # SeaweedFS, logiciel libre (Apache 2.0), à une version FIGÉE : on la change par une modification
  # du dépôt, jamais en silence (MinIO, l'ancien stockage, a retiré ses images en septembre 2026).
  # « mini » lance tout en un seul processus ; -bucket crée akfc-dev au démarrage s'il manque ;
  # les identifiants viennent des deux variables AWS_*. Le reste (WebDAV, Iceberg, Lance) est coupé.
  storage:
    image: ghcr.io/chrislusf/seaweedfs:4.52
    command: mini -bucket=akfc-dev -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: akfc-dev
      AWS_SECRET_ACCESS_KEY: akfc-dev-secret
    ports:
      - "127.0.0.1:9200:8333"
      - "127.0.0.1:9201:8888"
    volumes:
      - akfc-dev-seaweedfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Capture TOUS les e-mails envoyés par l'app (aucun ne part sur internet).
  mail:
    image: ghcr.io/axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  akfc-dev-pgdata:
  akfc-dev-seaweedfs:
